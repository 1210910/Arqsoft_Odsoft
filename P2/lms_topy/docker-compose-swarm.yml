services:
  lmstopy:
    image: lmstopy:latest
    environment:
      - SPRING_PROFILES_ACTIVE=sqlServer,bootstrap,recomendationAlgorithm2,hash
      - spring.datasource.url=jdbc:postgresql://postgres:5432/topy
      - spring.datasource.username=topy
      - spring.datasource.password=passwordtopy
      - file.upload-dir=/tmp/uploads-psoft-g1-instance1
      - spring.rabbitmq.host=rabbitmq
      - spring.rabbitmq.port=5672
      - spring.rabbitmq.username=guest
      - spring.rabbitmq.password=guest
    volumes:
      - "uploaded_files_volume_3:/tmp"
    deploy:
      replicas: 2
    ports:
      - "8090:8080"  # Expose the lmsbooks service on port 8089
    networks:
      - lms_network
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_DB=topy
      - POSTGRES_USER=topy
      - POSTGRES_PASSWORD=passwordtopy
      - spring.datasource.driver-class-name=org.postgresql.Driver
      - spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
    deploy:
      replicas: 2  # One replica is sufficient for most development setups
    ports:
      - "5452-5455:5432"  # Expose PostgreSQL on a unique host port to avoid conflicts
    networks:
      - lms_network

volumes:
  uploaded_files_volume_3:  # Retain only the used volume

networks:
  lms_network:
    external: true
    driver: overlay
