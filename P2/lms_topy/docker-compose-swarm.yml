services:
  lmstopy:
    image: lmstopy:latest
    environment:
      - SPRING_PROFILES_ACTIVE=sqlServer,bootstrap,recomendationAlgorithm2,hash
      - spring.datasource.url=jdbc:postgresql://postgres:5432/topy
      - spring.datasource.username=postgres
      - spring.datasource.password=password
      - file.upload-dir=/tmp/uploads-psoft-g1-instance1
      - spring.rabbitmq.host=rabbitmq
      - spring.rabbitmq.port=5672
      - spring.rabbitmq.username=guest
      - spring.rabbitmq.password=guest
    volumes:
      - "uploaded_files_volume_3:/tmp"
    deploy:
      replicas: 1
    ports:
      - "8090:8080"  # Expose the lmsbooks service on port 8089
    networks:
      - lms_network
    depends_on:
      - postgres
      - rabbitmq

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_DB=topy
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - spring.datasource.driver-class-name=org.postgresql.Driver
      - spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
    deploy:
      replicas: 1  # One replica is sufficient for most development setups
    ports:
      - "5453:5432"  # Expose PostgreSQL on a unique host port to avoid conflicts
    networks:
      - lms_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres && psql -U postgres -d ${POSTGRES_DB} -c '\\dt'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    deploy:
      replicas: 1
    ports:
      - "5672:5672"        #	RabbitMQ	main	port
      - "15672:15672"        #	RabbitMQ	management	UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - lms_network

volumes:
  uploaded_files_volume_3:  # Retain only the used volume
  postgres_data:  # Retain only the used volume

networks:
  lms_network:
    driver: overlay
